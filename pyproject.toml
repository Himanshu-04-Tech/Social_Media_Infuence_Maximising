[tool.pyrefly]
search-path = [
    ".",
    "backend/src",
    "backend",
    "src"
]

[tool.pyright]
include = ["backend", "dashboard", "src", "tests"]
extraPaths = [
    ".",
    "backend/src",
    "backend",
    "src"
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "backend/src",
    "backend",
    "src"
]
testpaths = ["backend/tests", "tests"]

